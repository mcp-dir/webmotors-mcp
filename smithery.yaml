# Smithery configuration for Webmotors
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_webmotors

name: webmotors-mcp
displayName: "Webmotors"
description: >
  Busca de veículos na Webmotors, o maior marketplace automotivo do Brasil. Pesquise anúncios por marca/modelo, veja detalhes completos (specs, fotos, vendedor) e o preço médio de mercado do modelo — o valor real pedido no marketplace, não só a tabela FIPE.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/webmotors-mcp
repository: https://github.com/mcp-dir/webmotors-mcp

tags:
  - webmotors
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_webmotors

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_webmotors/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
